<!-- Hero Section with Search -->
<section class="hero">
  <div class="overlay">
      <form [formGroup]="searchForm" (ngSubmit)="onSubmit()" class="search-box">
      <div class="form-group">
        <label for="destination">Destination</label>
         <input type="text" formControlName="destination" id="destination" placeholder="e.g. New York" />
         <div class="error-container">
          <div class="error" *ngIf="searchForm.get('destination')?.invalid && searchForm.get('destination')?.touched">
            Destination is required
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="checkin">Check-in</label>
        <input type="date" id="checkin" formControlName="checkin" [min]="minDate" />
        <div class="error-container">
          <div class="error" *ngIf="searchForm.get('checkin')?.invalid && searchForm.get('checkin')?.touched">
            Check-in date is required
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="checkout">Check-out</label>
        <input type="date" id="checkout" formControlName="checkout" placeholder="dd-mm-yyyy" [min]="minDate"/>
        <div class="error-container">
            <div class="error" *ngIf="searchForm.get('checkout')?.invalid && searchForm.get('checkout')?.touched">
              Check-out date is required
            </div>
            <div class="error" *ngIf="searchForm.hasError('dateError') && (searchForm.get('checkout')?.dirty || searchForm.get('checkout')?.touched)">
              Check-out must be after check-in
            </div>
        </div>
      </div>

      <button type="submit" class="search-button"  [disabled]="searchForm.invalid">🔍 Search Hotels</button>
    </form>
  </div>
</section>


<!-- Popular Destinations -->
<section class="destinations">
  <h2>Popular Destinations</h2>
  <div class="grid">
    <div class="destination" *ngFor="let city of cities">
      <img [src]="getImagePath(city)" [alt]="city" />
      <span>{{ city }}</span>
    </div>
  </div>
</section>
